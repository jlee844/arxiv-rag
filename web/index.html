<!doctype html>
<meta charset="utf-8"><title>arxiv-rag</title>
<style>
 body{font:15px/1.55 -apple-system,system-ui,sans-serif;max-width:820px;margin:2rem auto;padding:0 1rem;color:#1a1a1a}
 h1{font-size:1.2rem;margin:0 0 .2rem} .sub{color:#666;font-size:.85rem;margin-bottom:1.2rem}
 form{display:flex;gap:.5rem} input{flex:1;padding:.6rem;border:1px solid #ccc;border-radius:6px;font-size:15px}
 select,button{padding:.6rem;border:1px solid #ccc;border-radius:6px;background:#fff;font-size:14px;cursor:pointer}
 button{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
 #warn{display:none;background:#fff4f4;border:1px solid #e5b3b3;color:#8a1f1f;padding:.6rem .8rem;border-radius:6px;margin:1rem 0;font-size:.88rem}
 #answer{white-space:pre-wrap;margin:1.2rem 0;min-height:1em}
 .src{border-left:3px solid #ddd;padding:.4rem 0 .4rem .7rem;margin:.6rem 0;font-size:.85rem;color:#444}
 .src b{color:#1a1a1a} .rank{font-family:ui-monospace,monospace;font-size:.75rem;color:#777}
 .meta{color:#888;font-size:.8rem}
</style>
<h1>arxiv-rag</h1>
<div class="sub" id="health">loading…</div>
<form id="f">
  <input id="q" placeholder="Ask about the indexed papers…" autocomplete="off" required>
  <select id="mode"><option>hybrid</option><option>dense</option><option>bm25</option></select>
  <button>Ask</button>
</form>
<div id="warn"></div>
<div id="answer"></div>
<div id="sources"></div>
<script>
const $ = s => document.querySelector(s);

fetch('/api/health').then(r=>r.json()).then(h=>{
  $('#health').textContent =
    `${h.chunks} chunks · ${h.papers} papers · ${h.embed_model} · ${h.llm_model}` +
    (h.exact_search ? ' · exact search' : ' · HNSW');
});

$('#f').onsubmit = async e => {
  e.preventDefault();
  $('#answer').textContent = ''; $('#sources').innerHTML = ''; $('#warn').style.display='none';

  // EventSource is GET-only, so we parse the SSE stream from fetch() by hand.
  const res = await fetch('/api/chat', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({query:$('#q').value, mode:$('#mode').value})
  });
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '';
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream:true});
    const parts = buf.split('\n\n'); buf = parts.pop();   // keep partial event
    for (const raw of parts) {
      const ev = (raw.match(/^event: (.+)$/m)||[])[1];
      const dt = (raw.match(/^data: (.+)$/m)||[])[1];
      if (!ev || !dt) continue;
      const d = JSON.parse(dt);
      if (ev === 'sources') render(d);
      else if (ev === 'token') $('#answer').textContent += d.t;
      else if (ev === 'error') $('#answer').textContent += `\n[error] ${d.detail}`;
      else if (ev === 'done' && d.grounded === false) {
        $('#warn').textContent =
          '⚠ This answer cites no retrieved excerpt — it likely came from the ' +
          'model\'s own knowledge, not your papers. Treat it as ungrounded.';
        $('#warn').style.display = 'block';
      }
    }
  }
};

function render(d){
  const el = $('#sources');
  el.innerHTML = `<div class="meta">retrieved ${d.results.length} in ${d.took_ms} ms · ${d.mode}</div>`;
  for (const [i,r] of d.results.entries()) {
    const prov = [r.dense_rank ? `dense#${r.dense_rank}` : null,
                  r.bm25_rank  ? `bm25#${r.bm25_rank}`  : null]
                 .filter(Boolean).join(' + ') || '—';
    el.insertAdjacentHTML('beforeend', `<div class="src">
      <b>[${i+1}] ${r.title}</b> <span class="rank">${prov}${r.rrf_score?` · rrf ${r.rrf_score}`:''}</span><br>
      <span class="meta">${r.arxiv_id} · ${r.section}</span><br>${r.text.slice(0,240)}…</div>`);
  }
}
</script>
